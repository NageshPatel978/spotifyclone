<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Web Player: Music for everyone</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <link rel="stylesheet" href="log.svg">
    <div class="container flex bg-black">
        <script src="script.js"></script>
        <div class="left p-1">
            <div class="home rounded  bg-grey m-2">
                <div class=" logo invert"><img src="log.svg" alt="spotify">Spotify
                </div>
                <ul>
                    <li>
                        <img class="invert" src="home.svg" alt="home">Home
                    </li>
                    <li>
                        <img class="invert" src="search.svg" alt="home">Search
                    </li>
                </ul>

            </div>
            <div class="library rounded bg-grey m-2">
                <div class="heading">
                    <img class="invert" src="playlist.svg" alt="">
                    <h2>Your library</h2>
                </div>
                <div class="songlist">
                  <ul>
                    <li>
                        <div class="info invert">
                            <div class="invert">song name</div>
                            <div class="invert">song artist</div>
                        </div>
                        <div class="playnow">play now</div>
                    
                        <img class="invert" src="music.svg" alt="music">
                            <img class="invert" src="play.svg" alt="play">
                        
                    </li>
                  </ul>
                </div>
                <div class="footer">
                    <a href="https://www.spotify.com/in-en/legal/" tabindex="0">
                        Legal
                        <a href="https://www.spotify.com/in-en/safetyandprivacy/" tabindex="0">
                            Safety &amp; Privacy Center
                            <a href="https://www.spotify.com/in-en/legal/privacy-policy/" tabindex="0">
                                Privacy Policy
                                <a href="https://www.spotify.com/in-en/legal/cookies-policy/" tabindex="0">
                                    Cookies
                                    <a href="https://www.spotify.com/in-en/legal/privacy-policy/#s3" tabindex="0">
                                        About Ads
                                        <a href="https://www.spotify.com/in-en/accessibility/" tabindex="0">
                                            Accessibility

                </div>

            </div>
        </div>
        <div class="right">
            <div class="header">
                <div class="nav">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
                        color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M15 6C15 6 9.00001 10.4189 9 12C8.99999 13.5812 15 18 15 18"></path>
                    </svg>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
                        color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M9.00005 6C9.00005 6 15 10.4189 15 12C15 13.5812 9 18 9 18"></path>
                    </svg>
                </div>
                <div class="button">
                    <button>login</button>
                    <button>sign up</button>
                </div>
            </div>
            <div class="spotify-playlists">
                <h1 class="color">Spotify Playlists</h1>
                <div class="cardcontainer color">
                    <div class="card">
                        <img src="https://image-cdn-ak.spotifycdn.com/image/ab67706c0000da8435cf587edd6ecb3d0180a637"
                            alt="">
                        <h2>ENGLISH SONG</h2>
                        <p>Listen Best English Song</p>
                        <div class="play"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="40"
                                height="40">
                                <circle cx="12" cy="12" r="12" fill="#1DB954" />
                                <path d="M9 7L9 17L17 12Z" fill="#fff" />
                            </svg></div>
                    </div>
                    <div class="card">
                        <img src="https://image-cdn-ak.spotifycdn.com/image/ab67706c0000da8435cf587edd6ecb3d0180a637"
                            alt="">
                        <h2>ENGLISH SONG</h2>
                        <p>Listen Best English Song</p>

                    </div>
                </div>
                <div class="playbar">
                    <div class="songinfo"></div>
                    <div class="songbutton">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M8.06492 12.6258C8.31931 13.8374 9.67295 14.7077 12.3802 16.4481C15.3247 18.3411 16.797 19.2876 17.9895 18.9229C18.3934 18.7994 18.7654 18.5823 19.0777 18.2876C20 17.4178 20 15.6118 20 12C20 8.38816 20 6.58224 19.0777 5.71235C18.7654 5.41773 18.3934 5.20057 17.9895 5.07707C16.797 4.71243 15.3247 5.6589 12.3802 7.55186C9.67295 9.29233 8.31931 10.1626 8.06492 11.3742C7.97836 11.7865 7.97836 12.2135 8.06492 12.6258Z" stroke-linejoin="round"></path>
                            <path d="M4 4L4 20" stroke-linecap="round"></path>
                        </svg>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
                            <path d="M18.8906 12.846C18.5371 14.189 16.8667 15.138 13.5257 17.0361C10.296 18.8709 8.6812 19.7884 7.37983 19.4196C6.8418 19.2671 6.35159 18.9776 5.95624 18.5787C5 17.6139 5 15.7426 5 12C5 8.2574 5 6.3861 5.95624 5.42132C6.35159 5.02245 6.8418 4.73288 7.37983 4.58042C8.6812 4.21165 10.296 5.12907 13.5257 6.96393C16.8667 8.86197 18.5371 9.811 18.8906 11.154C19.0365 11.7084 19.0365 12.2916 18.8906 12.846Z"></path>
                        </svg>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M15.9351 12.6258C15.6807 13.8374 14.327 14.7077 11.6198 16.4481C8.67528 18.3411 7.20303 19.2876 6.01052 18.9229C5.60662 18.7994 5.23463 18.5823 4.92227 18.2876C4 17.4178 4 15.6118 4 12C4 8.38816 4 6.58224 4.92227 5.71235C5.23463 5.41773 5.60662 5.20057 6.01052 5.07707C7.20304 4.71243 8.67528 5.6589 11.6198 7.55186C14.327 9.29233 15.6807 10.1626 15.9351 11.3742C16.0216 11.7865 16.0216 12.2135 15.9351 12.6258Z" stroke-linejoin="round"></path>
                            <path d="M20 5V19" stroke-linecap="round"></path>
                        </svg>
                    </div>
                    <div class="songtime"></div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
